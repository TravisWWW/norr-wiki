name: 合并图鉴贡献

# 收件箱（data/bestiary-contrib/）收到新贡献时，自动并入唯一一份权威图鉴文档
# src/data/bestiary-live.json，并清空收件箱。提交后由 deploy.yml 重新构建并发布。
on:
  push:
    paths:
      - 'data/bestiary-contrib/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bestiary-merge
  cancel-in-progress: false

jobs:
  merge:
    # 机器人自己提交（清空收件箱）时不再触发，避免空跑
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 合并贡献 → 权威图鉴文档
        run: node tools/merge-bestiary-contrib.mjs
      - name: 提交合并结果
        run: |
          git config user.name "norr-wiki-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/bestiary-contrib src/data/bestiary-live.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "图鉴自动合并：$(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
