name: 合并图鉴贡献

# 图鉴数据的唯一权威文档是 src/data/bestiary-live.json。
# 数据来源：图鉴专用仓库 TravisWWW/norr-bestiary 的 contrib/*.json（小伴侣上传）。
#
# 触发方式：
#   · repository_dispatch（norr-bestiary 收到新数据后通知，近实时）
#   · schedule（每 5 分钟兜底，防止通知丢失）
#   · push 到 data/bestiary-contrib/**（本地手动投递 / 调试）
#
# 注意：机器人用 GITHUB_TOKEN 推送的提交【不会】再触发 deploy.yml（GitHub 防递归规则），
# 所以这里必须自己把 Pages 部署跑一遍。
on:
  repository_dispatch:
    types: [bestiary-contrib]
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'data/bestiary-contrib/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # 定时兜底每 5 分钟跑一次，绝不能把正在进行的部署掐掉
  cancel-in-progress: false

jobs:
  merge:
    # 机器人自己提交（清空收件箱）时不再触发，避免空跑；定时 / dispatch 不受影响
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 拉取图鉴收件箱（norr-bestiary）
        run: |
          mkdir -p data/bestiary-contrib
          if git clone --depth 1 https://github.com/TravisWWW/norr-bestiary.git /tmp/inbox 2>/dev/null; then
            cp -f /tmp/inbox/contrib/*.json data/bestiary-contrib/ 2>/dev/null || true
            echo "收件箱文件："; ls -1 data/bestiary-contrib/ || true
          else
            echo "未能拉取 norr-bestiary（可能尚未创建），仅使用本地 data/bestiary-contrib/"
          fi
      - name: 合并贡献 → 权威图鉴文档
        run: node tools/merge-bestiary-contrib.mjs
      - name: 提交合并结果
        id: commit
        run: |
          git config user.name "norr-wiki-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/bestiary-contrib src/data/bestiary-live.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "图鉴自动合并：$(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: merge
    if: needs.merge.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
